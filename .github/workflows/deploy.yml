# Build and deploy to Cloudflare Workers.
#
# This replaces Cloudflare's own Workers Builds, which cannot run for this
# account: its build configuration is bound to a build token owned by a user who
# has left the organisation, and Cloudflare refuses to let the remaining members
# use or replace it — creating a fresh token in the dashboard was tried three
# times and every build still failed during initialisation, before checkout.
#
# Running the same two commands here removes that dependency entirely. The steps
# are exactly what `cf:deploy` runs locally, so a green run means the same
# artifact a developer would have deployed by hand.
#
# Triggered by:
#   repository_dispatch — the CMS's Publish button (event type "cms-publish")
#   workflow_dispatch   — a manual run from the Actions tab
#   push                — any commit to the production branch
name: Deploy

on:
  repository_dispatch:
    types: [cms-publish]
  workflow_dispatch:
  push:
    branches: [location-map-and-fixes]

# One deploy at a time. Two builds racing would leave whichever finished second
# live, which is not necessarily the newer content.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Only the repository actually wired to Cloudflare may deploy. The branch is
    # also pushed to a mirror repo (…/3lines-website-clone) as a backup, and
    # this same file rode along — but the mirror has none of the secrets below,
    # so every push produced a failed run and a red-✗ email that looked like a
    # production incident. Skipping is keyed to the repo NAME, not the owner, so
    # the guard survives transferring this repository to an organisation.
    if: github.event.repository.name == '3lines-website'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The production branch, explicitly, whatever triggered this run.
      # repository_dispatch (the Publish button) is only ever delivered against
      # the DEFAULT branch — GitHub ignores the event for workflow files that
      # live anywhere else — so this file has to exist on main while the site is
      # built from location-map-and-fixes. Pinning the ref makes both entry
      # points produce the same artifact instead of main silently deploying
      # itself.
      - uses: actions/checkout@v4
        with:
          ref: location-map-and-fixes

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # cf:build runs scripts/cf-prebuild.mjs first, which exports content/ from
      # the REMOTE D1 — that is what carries an editor's saved changes into the
      # build. It fails the build rather than silently shipping stale content, so
      # the token below is required, not optional.
      #
      # A SEPARATE token from the deploy step, deliberately. Cloudflare's "Edit
      # Cloudflare Workers" template grants no D1 access (the export failed 7403
      # under it), and a D1 token grants no script access (10000). Rather than
      # asking for one broad token, each step gets exactly the scope it needs —
      # which is also the better security posture. CLOUDFLARE_D1_TOKEN may be
      # read-only on D1; nothing here writes to the database.
      - name: Build
        run: npm run cf:build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
