# Build and deploy to Cloudflare Workers.
#
# This replaces Cloudflare's own Workers Builds, which cannot run for this
# account: its build configuration is bound to a build token owned by a user who
# has left the organisation, and Cloudflare refuses to let the remaining members
# use or replace it — creating a fresh token in the dashboard was tried three
# times and every build still failed during initialisation, before checkout.
#
# Running the same two commands here removes that dependency entirely. The steps
# are exactly what `cf:deploy` runs locally, so a green run means the same
# artifact a developer would have deployed by hand.
#
# Triggered by:
#   repository_dispatch — the CMS's Publish button (event type "cms-publish")
#   workflow_dispatch   — a manual run from the Actions tab
#   push                — any commit to the production branch
name: Deploy

on:
  repository_dispatch:
    types: [cms-publish]
  workflow_dispatch:
  push:
    branches: [location-map-and-fixes]

# One deploy at a time. Two builds racing would leave whichever finished second
# live, which is not necessarily the newer content.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # cf:build runs scripts/cf-prebuild.mjs first, which exports content/ from
      # the REMOTE D1 — that is what carries an editor's saved changes into the
      # build. It fails the build rather than silently shipping stale content, so
      # the token below is required, not optional.
      - name: Build
        run: npm run cf:build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
