# nginx front for the 3Lines site.
#   /        -> Next.js under pm2 (port 3000)
#   /admin   -> the CMS under pm2 (port 3001), once its source is recovered
#
# Static assets are served straight from disk with a long cache, which is safe
# because every asset URL carries a content hash (lib/assets.ts) — the filename
# query changes whenever the bytes change.

server {
  listen 80;
  server_name 3lines.com.sa www.3lines.com.sa;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name 3lines.com.sa www.3lines.com.sa;

  ssl_certificate     /etc/letsencrypt/live/3lines.com.sa/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/3lines.com.sa/privkey.pem;

  # Security headers. HSTS is deliberately left commented until you are certain
  # every subdomain is on HTTPS — it is hard to undo once browsers cache it.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 25m;   # CMS image uploads
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Content-hashed assets: safe to cache hard.
  location /assets/ {
    alias /srv/3lines/current/public/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location /_next/static/ {
    alias /srv/3lines/current/.next/static/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location /admin {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
